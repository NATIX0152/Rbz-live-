# Blueprint Render : New > Blueprint > choisir ce dépôt
services:
  - type: web
    name: rbz-live
    runtime: node
    plan: free
    branch: claude/eager-gates-mlqpyn
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TIKTOK_USERNAME  # compte à suivre automatiquement (ex: eiji_rensuke)
        sync: false
      - key: EULER_API_KEY   # optionnel : à renseigner dans le dashboard Render
        sync: false
