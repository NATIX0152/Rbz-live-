<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Overlay enchère</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font:700 16px system-ui,Segoe UI,sans-serif;width:420px}
.box{border:3px solid #ffc83d;border-radius:16px;background:rgba(10,6,8,.85);overflow:hidden}
.tag{padding:10px;text-align:center;font-size:20px;border-bottom:2px solid #2e1b23}.tag.snipe{background:#2a0a10;color:#ff6b86}
.timer{font-size:56px;text-align:center;padding:8px;color:#2ee6a0;font-variant-numeric:tabular-nums;border-bottom:2px solid #6b5415}.timer.low{color:#ff2d55}
.row{display:flex;align-items:center;gap:10px;margin:8px;padding:8px 10px;border-radius:12px;border:2px solid #6c6c78;background:#1f1f25}
.row:nth-child(1){border-color:#c99a12;background:#3a2c08}.row:nth-child(3){border-color:#a56a2c;background:#2d1b0c}
.av{width:36px;height:36px;border-radius:50%;background:#444 center/cover}.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.c{color:#ffc83d}
.foot{text-align:center;padding:8px;font-size:13px;color:#bbb;border-top:2px solid #2e1b23}.win{padding:14px;text-align:center;font-size:22px;color:#ffc83d}
</style></head><body><div class="box"><div class="tag" id="tag">AUCTION</div><div class="timer" id="t">00:00</div><div id="lb"></div><div class="foot" id="f"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function go(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
ws.onmessage=e=>{const s=JSON.parse(e.data).state;
 const snipe=s.status==='running'&&s.bonusEnabled&&s.remaining<=s.snipeDelay;
 tag.textContent=s.status==='ended'?'TERMINÉE':snipe?'⚡ SNIPE DELAY +'+s.bonusTime+'s':s.status==='running'?'ENCHÈRE EN COURS':s.status==='paused'?'EN PAUSE':'ENCHÈRE';
 tag.className='tag'+(snipe?' snipe':'');t.textContent=mm(s.remaining);t.className='timer'+(s.status==='running'&&s.remaining<=10?' low':'');
 lb.innerHTML=(s.status==='ended'&&s.winner?`<div class="win">🏆 ${esc(s.winner.nickname)}</div>`:'')+s.leaderboard.slice(0,3).map(u=>`<div class="row"><div class="av" style="background-image:url('${esc(u.avatar||'')}')"></div><div class="n">${esc(u.nickname)}</div><div class="c">${u.coins.toLocaleString('fr-FR')} 🪙</div></div>`).join('');
 f.textContent='Participants : '+s.participants+' · Total '+s.totalCoins.toLocaleString('fr-FR')+' 🪙';};
ws.onclose=()=>setTimeout(go,1500)}go();
</script></body></html>
